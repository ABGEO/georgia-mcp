name: images

on:
  push:
    branches: [ main ]
    tags: [ "v*.*.*" ]
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
  workflow_dispatch:

permissions: { }

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request and a push to main build the image whose files changed. A tag and a
  # manual run build every image, so each release publishes both versions.
  changes:
    name: Image changes
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: filter
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            georgia-mcp:
              - cmd/**
              - internal/**
              - pkg/**
              - go.mod
              - go.sum
              - build/package/**
              - .github/workflows/images.yml
            georgia-mcp-website:
              - website/**
              - .github/workflows/images.yml

      - id: matrix
        name: Images to build
        env:
          EVERY: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
          CHANGED: ${{ steps.filter.outputs.changes || '[]' }}
          IMAGES: |
            [
              {
                "name": "georgia-mcp",
                "description": "An MCP server for Georgian public services.",
                "context": ".",
                "file": "build/package/Dockerfile",
                "lockfile": "go.sum"
              },
              {
                "name": "georgia-mcp-website",
                "description": "The website of Georgia MCP.",
                "context": "website",
                "file": "website/.docker/Dockerfile",
                "lockfile": "website/pnpm-lock.yaml"
              }
            ]
        run: |
          if [ "$EVERY" = "true" ]; then
            CHANGED=$(jq -c '[.[].name]' <<<"$IMAGES")
          fi
          value=$(jq -c --argjson changed "$CHANGED" \
            '[.[] | select(.name as $name | $changed | index($name))]' <<<"$IMAGES")
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "Images to build: $value"

  image:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Go writes the module version into the binary from the tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Version
        id: version
        run: echo "value=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=ref,event=pr
          labels: &oci |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          annotations: *oci

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: amd64,arm64

      - id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The layer cache misses the RUN --mount=type=cache directories. The cache dance
      # keeps them. Both directories sit outside the build context, so Go does not see
      # a modified work tree.
      - id: mounts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/buildkit-mounts
          key: buildkit-mounts-${{ matrix.name }}-${{ hashFiles(matrix.lockfile, matrix.file) }}
          restore-keys: buildkit-mounts-${{ matrix.name }}-

      - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          dockerfile: ${{ matrix.file }}
          cache-dir: ${{ runner.temp }}/buildkit-mounts
          scratch-dir: ${{ runner.temp }}/buildkit-scratch
          skip-extraction: ${{ steps.mounts.outputs.cache-hit }}

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && steps.meta.outputs.tags != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }},ignore-error=true

      - if: github.event_name != 'pull_request' && steps.meta.outputs.tags != ''
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign
        if: github.event_name != 'pull_request' && steps.meta.outputs.tags != ''
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE,,}@${DIGEST}"

  registry:
    name: MCP Registry
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install mcp-publisher
        run: |
          archive=mcp-publisher_linux_amd64.tar.gz
          base="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "$base/$archive"
          curl -fsSL -o "$RUNNER_TEMP/$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob "$RUNNER_TEMP/$archive" \
            --bundle "$RUNNER_TEMP/$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" mcp-publisher

      - name: Version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          jq --arg version "${TAG#v}" '
            .version = $version
            | .packages |= map(if .registryType == "oci" then .identifier |= sub(":[^:]+$"; ":" + $version) else . end)
          ' build/mcp-registry/server.json > "$RUNNER_TEMP/server.json"
          cat "$RUNNER_TEMP/server.json"

      - name: Publish
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish "$RUNNER_TEMP/server.json"

  # A skipped image reports no check, so the branch protection requires this job instead
  # of the image jobs. It fails when an image that ran has failed.
  images:
    name: Images
    if: always()
    needs: [ changes, image, registry ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { }
    steps:
      - name: Result
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$FAILED" = "true" ]; then
            echo "An image of the workflow failed."
            exit 1
          fi
