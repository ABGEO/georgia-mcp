name: openai-plugin

on:
  release:
    types: [ published ]

permissions: { }

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          manifest="$(jq -r .version build/openai-plugin/plugin.json)"
          if [ "$manifest" != "$version" ]; then
            echo "build/openai-plugin/plugin.json holds $manifest, the tag is $TAG. Merge the pull request of BLD-018 before the release."
            exit 1
          fi
          (cd build/openai-plugin && zip -r -X "$RUNNER_TEMP/georgia-public-data-$version.zip" .)
          echo "ZIP=$RUNNER_TEMP/georgia-public-data-$version.zip" >> "$GITHUB_ENV"

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"
