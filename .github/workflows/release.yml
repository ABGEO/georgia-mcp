name: release

on:
  push:
    tags: [ "v*.*.*" ]

permissions: { }

cache-mode: none

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  binaries:
    name: Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GORELEASER_VERSION: v2.20.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: OpenVEX
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          go tool govulncheck -format openvex ./... > "$RUNNER_TEMP/govulncheck.json"
          jq --arg author "https://github.com/$REPOSITORY" \
            --arg product "pkg:golang/github.com/abgeo/georgia-mcp@$TAG" '
            .author = $author
            | .statements |= map(.products = [{"@id": $product}])
          ' "$RUNNER_TEMP/govulncheck.json" > "$RUNNER_TEMP/openvex.json"
          jq -r '.statements[] | "\(.vulnerability.name): \(.status)"' "$RUNNER_TEMP/openvex.json"

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # The Scorecard finds provenance by the suffix .intoto.jsonl on a release file.
      - name: Upload the provenance
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TAG: ${{ github.ref_name }}
        run: |
          provenance="$RUNNER_TEMP/georgia-mcp_${TAG#v}.intoto.jsonl"
          jq -c . "$BUNDLE" > "$provenance"
          gh release upload "$TAG" "$provenance" --clobber --repo "$GITHUB_REPOSITORY"
