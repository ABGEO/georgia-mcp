# A dependency of the server must be compatible with the GPL-3.0 license.
allow-licenses:
  - 0BSD
  - Apache-2.0
  - BlueOak-1.0.0
  - BSD-2-Clause
  - BSD-3-Clause
  - CC-BY-4.0
  - CC0-1.0
  - GPL-3.0-only
  - GPL-3.0-or-later
  - ISC
  - LGPL-3.0-or-later
  - LicenseRef-scancode-google-patent-license-golang
  - MIT
  - MPL-2.0

# The website build uses these tools. Their license data carries JSON or CC-BY-SA-2.5,
# and nothing of them ships with the server.
allow-dependencies-licenses:
  - pkg:npm/json-schema-typed
  - pkg:npm/vscode-css-languageservice
  - pkg:npm/vscode-html-languageservice
