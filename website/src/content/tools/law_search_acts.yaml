      ka: მოძებნე საქართველოს შრომის კოდექსი.
    answer:
      en: "The Legislative Herald has one active law with this title: the Organic Law of Georgia, Labour Code of Georgia, number N4113-რს. The Parliament of Georgia signed it on 17 December 2010."
      ka: "საკანონმდებლო მაცნეში ამ სათაურით ერთი მოქმედი კანონია: საქართველოს ორგანული კანონი, საქართველოს შრომის კოდექსი, ნომერი N4113-რს. საქართველოს პარლამენტმა ის 2010 წლის 17 დეკემბერს მიიღო."
