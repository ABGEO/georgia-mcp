    answer:
      en: "Yes. 26 May 2027 is Independence Day, a public holiday in Georgia. It falls on a Wednesday."
      ka: "დიახ. 2027 წლის 26 მაისი დამოუკიდებლობის დღეა, საქართველოში დასვენების დღე. ის ოთხშაბათს მოდის."
