version: "3"

includes:
  website:
    taskfile: website/Taskfile.yml
    dir: website

vars:
  IMAGE: georgia-mcp:dev
  COMPOSE: docker compose -f deployments/compose.yaml
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  REVISION:
    sh: git rev-parse HEAD 2>/dev/null || echo unknown

tasks:
  default:
    desc: List the tasks.
    silent: true
    cmds:
      - "{{.TASK_EXE}} --list"

  lint:
    desc: Run the linter.
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run the tests with the race detector.
    cmds:
      - go test -race ./...

  test:live:
    desc: Run the live tests against the real sources, with the keys of .env.
    dotenv: [ .env ]
    cmds:
      - go test -tags live -run '^TestLive' -count=1 ./internal/... ./pkg/...

  build:
    desc: Build every package.
    cmds:
      - go build ./...

  vuln:
    desc: Check the module for a known vulnerability.
    cmds:
      - go tool govulncheck ./...

  release-check:
    desc: Check a release of the server.
    cmds:
      - task: build
      - task: vuln

  run:
    desc: Run the server over HTTP with Go and the local configuration.
    cmds:
      - go run ./cmd/georgia-mcp serve

  image:
    desc: Build the container image.
    cmds:
      - >-
        docker build -f build/package/Dockerfile
        --build-arg VERSION={{.VERSION}}
        --build-arg REVISION={{.REVISION}}
        -t {{.IMAGE}} .

  compose:up:
    desc: Build and start the server in a container, with the local configuration.
    cmds:
      - "{{.COMPOSE}} up -d --build"

  compose:start:
    desc: Start the stopped container.
    cmds:
      - "{{.COMPOSE}} start"

  compose:stop:
    desc: Stop the container and keep it.
    cmds:
      - "{{.COMPOSE}} stop"

  compose:down:
    desc: Stop and remove the container and its network.
    cmds:
      - "{{.COMPOSE}} down"
